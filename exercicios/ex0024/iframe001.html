<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            height: 400px;
            width: 400px;
            border: 3px solid #04f7f3;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <p>
        Acessando o site do

        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="no">
            
            <a href="https://www.cursoemvideo.com">cursoemvideo</a>
        </iframe>

        para aprender a programar.
        </p>

        <p>O site do
            
            <iframe src="https://www.google.com.br" frameborder="0"></iframe>
            
        também é muito legal, pena que não fuciona dentro de iframe.

        <h2>Treinando iframe a partir daqui</h2>
        <p> Esse e meu site de baixar fontes 

            <iframe src="https://www.dafont.com/pt/" frameborder="0" height="500" width="500">

                <a href="https://www.dafont.com/pt/">Dafont.com</a>
            </iframe>

            ele é muito bom para baixar fontes e tem uma variedade muito grande.
        </p>
    </p>
</body>
</html>
